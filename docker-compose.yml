version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: zoqonyx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: zoqonyx_db
    ports:
      - "5432:5432"
    volumes:
      - zoqonyx_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: zoqonyx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - zoqonyx_redisdata:/data

volumes:
  zoqonyx_pgdata:
  zoqonyx_redisdata:
